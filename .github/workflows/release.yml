name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build ZeroTraceFXAI.exe and source archive
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install core dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install optional Windows extras
        shell: pwsh
        run: |
          function Install-OptionalPackage {
            param([Parameter(Mandatory = $true)][string]$Package)

            try {
              Write-Host "Attempting optional install: $Package"
              python -m pip install $Package --only-binary=:all:
              if ($LASTEXITCODE -ne 0) {
                throw "pip returned exit code $LASTEXITCODE for $Package"
              }
              Write-Host "$Package installed successfully."
            }
            catch {
              Write-Warning "Could not install optional package $Package; continuing: $_"
              $global:LASTEXITCODE = 0
            }
          }

          Install-OptionalPackage -Package "PySide6"
          Install-OptionalPackage -Package "MetaTrader5"

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Build executable (folder bundle)
        run: pyinstaller --noconfirm --clean --distpath python-dist --workpath python-build zerotrace.spec

      - name: Build standalone single-file executable
        shell: pwsh
        run: |
          $env:ZT_ONEFILE = "1"
          pyinstaller --noconfirm --clean --distpath dist-onefile --workpath build-onefile zerotrace.spec
          if (-not (Test-Path "dist-onefile\ZeroTraceFXAI.exe" -PathType Leaf)) {
            throw "Standalone executable was not created"
          }
          Copy-Item "dist-onefile\ZeroTraceFXAI.exe" "ZeroTraceFXAI-$env:GITHUB_REF_NAME-windows.exe" -Force

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build Electron installer and portable executable
        shell: pwsh
        run: |
          npm install
          if (Test-Path "release-python") { Remove-Item "release-python" -Recurse -Force }
          New-Item -ItemType Directory -Path "release-python" | Out-Null
          Copy-Item "python-dist\ZeroTraceFXAI" "release-python\ZeroTraceFXAI" -Recurse -Force
          npm run package:windows
          Get-ChildItem "dist\ZeroTrace FX AI*" | ForEach-Object { Write-Host $_.FullName }

      - name: Verify executable and package Windows ZIP
        shell: pwsh
        run: |
          $exePath = "python-dist\ZeroTraceFXAI\ZeroTraceFXAI.exe"
          if (-not (Test-Path $exePath -PathType Leaf)) {
            throw "Expected executable was not created: $exePath"
          }

          Copy-Item .env.example "python-dist\ZeroTraceFXAI\.env.example" -Force
          $windowsZip = "ZeroTraceFXAI-$env:GITHUB_REF_NAME-windows.zip"
          if (Test-Path $windowsZip) {
            Remove-Item $windowsZip -Force
          }
          Compress-Archive -Path "python-dist\ZeroTraceFXAI" -DestinationPath $windowsZip -CompressionLevel Optimal
          Write-Host "Created $windowsZip"

      - name: Package source ZIP
        shell: pwsh
        run: |
          $sourceZip = "ZeroTraceFXAI-$env:GITHUB_REF_NAME-source.zip"
          git archive --format=zip --prefix=ZeroTraceFXAI/ --output=$sourceZip HEAD
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $sourceZip -PathType Leaf)) {
            throw "Failed to create source archive: $sourceZip"
          }
          Write-Host "Created $sourceZip"

      - name: Upload release ZIPs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTraceFXAI-${{ github.ref_name }}-release-zips
          path: |
            ZeroTraceFXAI-${{ github.ref_name }}-windows.zip
            ZeroTraceFXAI-${{ github.ref_name }}-windows.exe
            ZeroTraceFXAI-${{ github.ref_name }}-source.zip
            dist/ZeroTrace FX AI*.exe
            dist/ZeroTrace FX AI*.nsis.7z
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the preinstalled Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > android/local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        env:
          ZT_VERSION_NAME: ${{ github.ref_name }}
          ZT_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console=plain assembleRelease 2>&1 | tee gradle.log; then
            grep -E "error:|What went wrong|FAILURE|Exception|> " gradle.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "ZeroTraceFXAI-${GITHUB_REF_NAME}-android.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroTraceFXAI-${{ github.ref_name }}-android
          path: ZeroTraceFXAI-${{ github.ref_name }}-android.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## ZeroTrace FX AI ${{ github.ref_name }}

            ZeroTrace FX AI 2.0.0 is a real-mode-only terminal. It attaches to an
            already authenticated MetaTrader 5 Desktop session through the official
            API and never stores or requests an MT5 password.

            | File | What it is |
            |---|---|
            | `ZeroTraceFXAI-${{ github.ref_name }}-windows.exe` | Standalone Windows Python terminal |
            | `ZeroTraceFXAI-${{ github.ref_name }}-windows.zip` | Windows app folder bundle |
            | `ZeroTraceFXAI-${{ github.ref_name }}-android.apk` | Android remote monitor/control app |
            | `ZeroTraceFXAI-${{ github.ref_name }}-source.zip` | Source code and Electron workstation |

            The APK and Electron shell control the Python engine; neither performs
            MT5 authentication. Enable `REMOTE_API_ENABLED=true` only on a trusted
            LAN/VPN and set a random `REMOTE_API_TOKEN`. See `docs/MOBILE.md`.

            **Trading forex involves substantial risk of loss.**
