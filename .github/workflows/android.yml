name: Android APK Build

on:
  push:
    branches: [ feature/v2-cross-platform-build ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Gradle
        run: |
          echo "Android scaffold placeholder"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTraceFX-APK
          path: .
