name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Windows extras (optional, best-effort)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pip install PySide6 --only-binary=:all: 2>&1 | Out-String
          pip install MetaTrader5 --only-binary=:all: 2>&1 | Out-String
          Write-Host "Windows extras install attempted (MT5 may be unavailable on 3.13 - expected)"
        continue-on-error: true
      - name: Byte-compile everything
        run: python -m compileall -q main.py core config market smart_money strategy execution risk paper live backtest dashboard utils tests
      - name: Run test-suite
        run: python -m pytest tests/ -q
      - name: CLI smoke test
        run: python main.py version
