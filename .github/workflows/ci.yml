name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Install Windows extras (optional, best-effort)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($package in @("PySide6", "MetaTrader5")) {
            try {
              Write-Host "Attempting optional install: $package"
              python -m pip install $package --only-binary=:all:
              if ($LASTEXITCODE -ne 0) {
                throw "pip returned exit code $LASTEXITCODE for $package"
              }
              Write-Host "$package installed successfully."
            }
            catch {
              Write-Warning "Could not install optional package $package; continuing: $_"
              $global:LASTEXITCODE = 0
            }
          }
      - name: Byte-compile everything
        run: python -m compileall -q main.py core config market smart_money strategy execution risk paper live backtest dashboard utils tests
      - name: Run test suite
        run: python -m pytest tests/ -q
      - name: CLI smoke test
        run: python main.py version

  android:
    name: Build Android companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the preinstalled Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > android/local.properties
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        env:
          ZT_VERSION_NAME: ci
          ZT_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console=plain assembleDebug 2>&1 | tee gradle.log; then
            grep -E "error:|What went wrong|FAILURE|Exception|> " gradle.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

