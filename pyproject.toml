[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zerotrace-fx-ai"
version = "2.0.0"
description = "Institutional Smart Money Autonomous Forex Trading Platform"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0,<4",
    "numpy>=1.26,<3",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
windows = ['MetaTrader5; sys_platform == "win32"', 'PySide6>=6.6; sys_platform == "win32"']
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["core*", "config*", "ai*", "market*",  "smart_money*", "strategy*", "execution*", "risk*", "dashboard*", "live*", "remote*", "mt5*", "database*", "utils*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "dashboard/*"]
