plugins {
    id "com.android.application"
}

android {
    namespace "com.zerotrace.fxai"
    compileSdk 34

    defaultConfig {
        applicationId "com.zerotrace.fxai"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("ZT_VERSION_CODE") ?: "3").toInteger()
        versionName System.getenv("ZT_VERSION_NAME") ?: "1.1.0"
    }

    signingConfigs {
        release {
            def ks = System.getenv("ZT_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ZT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ZT_KEY_ALIAS")
                keyPassword System.getenv("ZT_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("ZT_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
